[Unit]
# magic aborts fatally if /dev/input/event2 is absent. virtual-touch creates that
# node, but Before= only orders service *start* - magic still probed before the
# uinput device existed and died. Require the service AND wait for the node.
Requires=virtual-touch.service
After=virtual-touch.service

[Service]
ExecStartPre=/bin/bash -c 'for i in $(seq 1 100); do [ -e /dev/input/event2 ] && exit 0; sleep 0.1; done; echo "event2 never appeared" >&2; exit 1'
Restart=on-failure
RestartSec=2
